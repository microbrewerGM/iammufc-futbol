name: Dev Access smoke

on:
  workflow_dispatch:
    inputs:
      p17_gemma_canary:
        description: Run the bounded Gemma 4 intent canary after the baseline smoke
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate smoke client without credentials
        run: node --test tools/test_dev_access_smoke.mjs tools/test_p17_canary_smoke.mjs
      - name: Test protected dev site
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node tools/dev-access-smoke.mjs
      - name: Run bounded Gemma 4 intent canary
        if: inputs.p17_gemma_canary
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node tools/p17-canary-smoke.mjs
