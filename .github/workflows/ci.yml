# Tests, typecheck, and supply-chain gates.
#
# BOTH test suites must run. pytest and vitest assert the same committed
# vectors (tests/vectors/artifact-keys.json); running only one defeats the
# cross-language drift check entirely -- see docs/pin-registry.md P7/P8/P15.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege at the workflow level; jobs widen only where they must.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install (locked)
        run: |
          uv sync --locked      # fails rather than re-resolving; ADR-0004
          npm ci                # lockfile only, no arbitrary resolution

      - name: Python tests
        run: uv run pytest -q

      - name: TypeScript tests
        # Same fixture as pytest. If the two languages disagree, one fails.
        run: npx vitest run

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: uv run ruff check .

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Action pins are commit SHAs that actually resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python .github/scripts/check_action_pins.py

      - name: No version ranges in manifests
        # ADR-0004: exact pins only. A caret defers the decision to install
        # time, so two machines get different trees.
        run: uv run python .github/scripts/check_exact_pins.py

      - name: Python dependency audit
        run: |
          uv sync --locked
          uvx pip-audit --strict || uv run pip-audit --strict

      - name: npm dependency audit
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Secret scan (gitleaks)
        # Backstop behind push protection, not a replacement for it -- push
        # protection blocks the commit before it lands; this catches anything
        # that got in another way (a squash-merge, a force-push before the
        # ruleset existed, a rebase). .gitleaks.toml documents the one
        # allowlisted pattern (a committed sha256 test fixture) and why.
        #
        # GITHUB_TOKEN is required here, not optional -- found by running this
        # on a real PR for the first time (earlier commits went straight to
        # main via push, which doesn't need it). gitleaks-action v3 refuses to
        # scan pull_request events without it: "GITHUB_TOKEN is now required
        # to scan pull requests."
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload results
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
