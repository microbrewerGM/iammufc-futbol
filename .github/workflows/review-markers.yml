name: Review markers

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-markers-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-markers:
    name: review-markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request head objects
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Check review markers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/ci/review_markers.py
