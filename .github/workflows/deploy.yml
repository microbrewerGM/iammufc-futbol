# Deployment. Dev only -- decided 2026-08-22: this project has no production
# environment, so there is no promotion gate left to guarantee here.
#
# The property this file still exists to guarantee:
#
#   Deploy jobs run ONLY on push to main -- post-merge. A
#   pull_request event from a fork runs with an empty secrets context, so a
#   hostile PR can run the test suite but can never read a Cloudflare token.
#   Never add `pull_request_target` with a fork checkout: that is the one
#   trigger combining untrusted code with secret access.
#
# Cloudflare does not support OIDC from GitHub Actions (wrangler-action#402,
# workers-sdk#11434 both still open). A long-lived per-environment token is the
# only option; scoping and rotation are compensating controls, not a fix.
# Tracked as exception E-007.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [p13-private-seed-ready]

permissions:
  contents: read

# Deploys and nightly refreshes mutate the same dev D1 database. Queue every
# publication run in one FIFO concurrency group; never cancel an in-flight or
# already-waiting import. GitHub currently permits up to 100 queued runs.
concurrency:
  group: iammufc-dev-publication
  cancel-in-progress: false
  queue: max

jobs:
  deploy-dev:
    name: deploy-dev
    if: github.ref == 'refs/heads/main' && github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    environment: dev # no required reviewer; dev is disposable
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Read and validate v2 catalog producer statement
        id: catalog-provenance
        shell: bash
        run: python3 .github/scripts/verify_public_catalog_producer.py outputs >> "$GITHUB_OUTPUT"

      - name: Create short-lived read token for the private catalog producer
        id: catalog-read
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.IAMMUFC_PRIVATE_ARTIFACT_APP_CLIENT_ID }}
          private-key: ${{ secrets.IAMMUFC_PRIVATE_ARTIFACT_APP_PRIVATE_KEY }}
          owner: microbrewerGM
          repositories: iammufc-platform
          permission-actions: read

      - name: Verify v2 catalog producer run and artifact
        uses: ./.github/actions/verify-public-catalog-producer
        with:
          run-id: ${{ steps.catalog-provenance.outputs.run_id }}
          run-attempt: ${{ steps.catalog-provenance.outputs.run_attempt }}
          artifact-id: ${{ steps.catalog-provenance.outputs.artifact_id }}
          source-revision: ${{ steps.catalog-provenance.outputs.source_revision }}
          token: ${{ steps.catalog-read.outputs.token }}
          catalog-path: verified-public-catalog

      - name: Apply migrations (dev)
        # CF_TOKEN_DEV is scoped to D1/Workers-KV/Workers-Scripts/Cache-Purge
        # on this Cloudflare account ONLY -- not to a specific database.
        # Cloudflare token policies have no per-resource scope below account
        # level (verified 2026-08-19, docs/exceptions.md E-011), so this token
        # reaches everything else in the account too, `iammufc-dev`'s
        # decommissioned prod sibling included. What actually keeps this job
        # pointed at dev is the exact resource name below (iammufc-dev) plus
        # self-review-protocol Tier 2 on this file.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0001_schema.sql

      - name: Apply P16 telemetry migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0003_p16_dot_plot.sql

      - name: Apply bounded query-cache migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0004_cache_slots.sql

      - name: Apply account question history migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0005_account_question_history.sql

      - name: Apply season splits migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0006_season_splits.sql

      - name: Apply exploration request links migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0008_exploration_request_links.sql

      - name: Apply manager era records migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0009_manager_era_records.sql

      - name: Apply question requests migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0010_question_requests.sql

      - name: Apply opponent labels migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0011_opponent_labels.sql

      - name: Apply Champions League stage migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0012_cl_season_stage.sql

      - name: Deploy Worker (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: deploy --config infra/wrangler.jsonc --env dev

  consume-private-seed:
    name: consume-private-seed
    if: github.event_name == 'repository_dispatch' && github.event.action == 'p13-private-seed-ready' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    permissions:
      contents: read
    steps:
      - name: Check out public consumer main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create a short-lived read-only token for the private producer
        id: private-read
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.IAMMUFC_PRIVATE_ARTIFACT_APP_CLIENT_ID }}
          private-key: ${{ secrets.IAMMUFC_PRIVATE_ARTIFACT_APP_PRIVATE_KEY }}
          owner: microbrewerGM
          repositories: iammufc-platform
          permission-actions: read

      - name: Verify the referenced private producer run
        env:
          GH_TOKEN: ${{ steps.private-read.outputs.token }}
          PRIVATE_RUN_ID: ${{ github.event.client_payload.private_run_id }}
          PRIVATE_RUN_ATTEMPT: ${{ github.event.client_payload.private_run_attempt }}
          PRIVATE_COMMIT: ${{ github.event.client_payload.private_commit }}
          PRIVATE_ARTIFACT_ID: ${{ github.event.client_payload.private_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRIVATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRIVATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          workflow_id="$(gh api repos/microbrewerGM/iammufc-platform/actions/workflows/p13-private-seed.yml --jq .id)"
          export PRIVATE_WORKFLOW_ID="$workflow_id"
          gh api "repos/microbrewerGM/iammufc-platform/actions/runs/$PRIVATE_RUN_ID" \
            | python3 .github/scripts/verify_private_seed_run.py

      - name: Download only the referenced private artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ steps.private-read.outputs.token }}
          repository: microbrewerGM/iammufc-platform
          run-id: ${{ github.event.client_payload.private_run_id }}
          artifact-ids: ${{ github.event.client_payload.private_artifact_id }}
          path: private-seed

      - name: Verify the seed checksum and snapshot manifest
        id: private-seed-verify
        run: python3 .github/scripts/verify_private_seed_checksum.py

      - name: Set up Node for the dev Worker
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read and validate v2 catalog producer statement
        id: catalog-provenance
        shell: bash
        run: python3 .github/scripts/verify_public_catalog_producer.py outputs >> "$GITHUB_OUTPUT"

      - name: Verify v2 catalog producer run and artifact
        uses: ./.github/actions/verify-public-catalog-producer
        with:
          run-id: ${{ steps.catalog-provenance.outputs.run_id }}
          run-attempt: ${{ steps.catalog-provenance.outputs.run_attempt }}
          artifact-id: ${{ steps.catalog-provenance.outputs.artifact_id }}
          source-revision: ${{ steps.catalog-provenance.outputs.source_revision }}
          token: ${{ steps.private-read.outputs.token }}
          catalog-path: verified-public-catalog

      - name: Apply schema (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0001_schema.sql

      - name: Apply P16 telemetry migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0003_p16_dot_plot.sql

      - name: Apply bounded query-cache migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0004_cache_slots.sql

      - name: Apply account question history migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0005_account_question_history.sql

      - name: Apply season splits migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0006_season_splits.sql

      - name: Apply exploration request links migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0008_exploration_request_links.sql

      - name: Apply manager era records migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0009_manager_era_records.sql

      - name: Apply question requests migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0010_question_requests.sql

      - name: Apply opponent labels migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0011_opponent_labels.sql

      - name: Apply Champions League stage migration (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file infra/migrations/0012_cl_season_stage.sql

      - name: Load verified private seed into dev D1
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: d1 execute iammufc-dev --config infra/wrangler.jsonc --env dev --remote --file private-seed/0002_seed.sql

      - name: Deploy Worker (dev)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_TOKEN_DEV }}
          accountId: ${{ secrets.CF_ACCOUNT }}
          command: deploy --config infra/wrangler.jsonc --env dev

      - name: Verify protected health reports the loaded snapshot
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EXPECTED_PRIVATE_SNAPSHOT_ID: ${{ steps.private-seed-verify.outputs.snapshot_id }}
        run: node tools/dev-access-smoke.mjs snapshot
