# Rights manifest — the gate.
#
# Sole owner: the data-rights persona. It may NOT edit
# .github/workflows/rights-gate.yml; it does not get to weaken its own gate.
#
# Setting redistributable: true on a previously-false source requires human
# review. Any verified_date older than 12 months is an error (pin site P9).
#
# Public site = redistribution. "Non-commercial" grants nothing on its own.

version: 1

rights:
  - source_id: football_data_couk
    name: Football-Data.co.uk (via datahub / openfootball mirrors)
    licence_id: ODC-PDDL-1.0
    redistributable: true
    attribution_asset: null
    attribution_text: null
    attribution_text_es: null
    tos_snapshot: catalog/rights/sources/football-data-couk.md
    verified_date: 2026-08-18
    notes: >
      Mirrors publish under Open Data Commons PDDL v1.0, which places the data
      in the public domain. Match results and betting odds back to 1993-94.
      No xG, no player box scores.

  - source_id: openfootball
    name: openfootball
    licence_id: public-domain
    redistributable: true
    attribution_asset: null
    attribution_text: null
    attribution_text_es: null
    tos_snapshot: catalog/rights/sources/openfootball.md
    verified_date: 2026-08-18
    notes: Public-domain fixtures and results. Zero licensing constraint.

  - source_id: football_data_org
    name: football-data.org API (v4)
    licence_id: football-data-org-subscriber-tos
    redistributable: true
    attribution_asset: null
    attribution_text: "Football data provided by the Football-Data.org API"
    attribution_text_es: null
    tos_snapshot: catalog/rights/sources/football-data-org.md
    verified_date: 2026-08-22
    notes: >
      NOT the same source as football_data_couk above -- this is the
      football-data.org v4 REST API (fixtures, results, tables, squads, top
      scorers), a different site under different terms. Attribution is
      mandatory and MUST be rendered verbatim as given in attribution_text
      (clause 7.1) -- do not paraphrase or translate it.
      CONDITIONAL GRANT, unlike every other redistributable: true entry
      here: clause 9.1 forbids referencing this data after the subscription
      is cancelled. Treat as redistributable only while an active
      subscription exists -- if it lapses, this source's data must stop
      being served, not just stop being re-ingested. The schema has no field
      for that conditionality; this note is the only record of it until
      ingest is actually wired.
      Rate-limited at 10 req/min (Tier One/free) --
      pipeline/sources/ratelimit.py's TokenBucket already matches this.
      tos_snapshot for this entry was agent-captured (WebFetch), not human
      -- breaks this directory's normal convention, done on explicit user
      instruction 2026-08-22. Lower confidence than other entries until a
      human re-reads the source pages; see the snapshot file's own header
      for the full reasoning and mitigation taken.

  - source_id: fpl
    name: Fantasy Premier League public API
    licence_id: unofficial-tolerated
    redistributable: true
    attribution_asset: fpl_credit
    attribution_text: >
      Player data derived from the Fantasy Premier League public API.
      Not affiliated with or endorsed by the Premier League.
    attribution_text_es: >
      Datos de jugadores derivados de la API pública de Fantasy Premier
      League. No afiliado ni respaldado por la Premier League.
    tos_snapshot: catalog/rights/sources/fpl.md
    verified_date: 2026-08-18
    notes: >
      Unofficial and undocumented, but stable and universally used. The best
      free Man-United-specific player box-score source. Current season via the
      live API; 2016-17 onward via the vaastav/Fantasy-Premier-League archive.
      RISK: endpoints can change without notice. This is a tolerated-use
      position, not a granted licence -- reassess if the Premier League objects.

  # ---------------------------------------------------------------------------
  # Declared but NOT ingested. Present so the NO_RIGHTS path is exercised by a
  # real coverage cell and a real test, rather than existing only as a code
  # branch nobody has run.
  # ---------------------------------------------------------------------------
  - source_id: understat
    name: Understat
    licence_id: none
    redistributable: false
    attribution_asset: null
    attribution_text: null
    attribution_text_es: null
    tos_snapshot: catalog/rights/sources/understat.md
    verified_date: 2026-08-18
    notes: >
      Free xG and shot data with x/y coordinates covering Manchester United
      from 2014-15. No API; JSON embedded in pages. NO REDISTRIBUTION LICENCE.
      We may compute against it privately; we may not publish it. Any coverage
      cell citing this source must resolve to NO_RIGHTS.
      NOTE: xG itself is NOT blocked -- FPL publishes an Opta-derived
      expected_goals field from 2022-23 onward, and we serve that. Understat
      would only be needed for seasons before 2022-23.

  - source_id: fbref
    name: FBref / Sports Reference
    licence_id: none
    redistributable: false
    attribution_asset: null
    attribution_text: null
    attribution_text_es: null
    tos_snapshot: catalog/rights/sources/fbref.md
    verified_date: 2026-08-18
    notes: >
      The richest free Manchester United resource (Opta-sourced, 2017-18
      onward), and explicitly off-limits: the Data Use page states you should
      not create websites or tools based on data scraped from Sports Reference
      sites. Custom data requests carry a $5,000 minimum. NO REDISTRIBUTION.
      Carries metrics no green-tier source has -- progressive passes, carries,
      pressures -- which is exactly why it is the honest NO_RIGHTS case.
