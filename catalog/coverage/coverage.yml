  # --- The NO_RIGHTS case --------------------------------------------------
  # We know exactly where to get this, it would be trivial to serve, and we
  # may not. No green-tier source carries progressive passes: FPL does not
  # publish it, and the public-domain results feeds are match-level only.
  # Present so the refusal path is exercised by a real cell and a real test.
  - metric: progressive_passes
    entity_type: player
    granularity: box_score
    season: "2024-25"
    competition: PL
    source_id: fbref
    redistributable: false
    cost_class: cheap
    notes: >
      FBref's Data Use page states you should not create websites or tools
      based on data scraped from Sports Reference sites. This cell exists so
      the system refuses for the RIGHT reason -- NO_RIGHTS, not NO_DATA. The
      distinction matters to a user: one is a gap we could close by integrating
      a source, the other is a gap we may never close without paying for a
      licence.
