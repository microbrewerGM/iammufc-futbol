# Coverage matrix — the single source of truth for feasibility.
#
# Feasibility is a LOOKUP here. Absence of a cell means NOT_COMPUTABLE_DATA_MISSING.
# It never means "probably fine". An optimistic false positive produces a
# confident wrong answer, which is the worst outcome this system can produce.
#
# Deliberately absent, and load-bearing by their absence:
#   - Any event_with_coords cell. Free republishable Man United event data
#     covers 2017-18 ONLY (Wyscout/Pappalardo), and it is not ingested until M4.
#     So every shot_map / pass_map / heatmap request resolves to NO_DATA today.
#   - xg before 2022-23. FPL began publishing expected_goals that season; the
#     six earlier seasons genuinely have no xG we may serve. Understat has it
#     back to 2014-15 but grants no redistribution licence, so those seasons are
#     a RIGHTS problem, not a data problem -- and the matrix must not pretend
#     otherwise by simply omitting them silently.

version: 1

coverage:

