# Declared metrics. The LLM may only propose a metric_id that exists here;
# anything else is rejected by validation, not by the model.
#
# Spanish labels are part of the declaration, not a translation step. Football
# position and metric vocabulary differs materially between languages and must
# be a controlled mapping from codes, never ad-hoc string translation.

version: 1

metrics:
  - metric_id: goals
    label_en: Goals
    label_es: Goles
    description: Goals scored in the competition.
    description_es: Goles marcados en la competición.
    granularity: box_score
    unit: count
    decimals: 0

  - metric_id: assists
    label_en: Assists
    label_es: Asistencias
    description: Assists recorded in the competition.
    description_es: Asistencias registradas en la competición.
    granularity: box_score
    unit: count
    decimals: 0

  - metric_id: minutes
    label_en: Minutes played
    label_es: Minutos jugados
    description: Total minutes played.
    description_es: Total de minutos jugados.
    granularity: box_score
    unit: minutes
    decimals: 0

  - metric_id: points
    label_en: Fantasy points
    label_es: Puntos fantasy
    description: Fantasy Premier League scoring points; this is a fantasy-game score, not a general performance rating.
    description_es: Puntos del sistema de Fantasy Premier League; es una puntuación del juego fantasy, no una valoración general del rendimiento.
    granularity: box_score
    unit: points
    decimals: 0

  - metric_id: xg
    label_en: Expected goals
    label_es: Goles esperados
    description: Expected goals (xG), an estimate of the scoring likelihood of chances.
    description_es: Goles esperados (xG), una estimación de la probabilidad de marcar de las ocasiones.
    granularity: box_score
    unit: xg
    decimals: 2

  # Declared so the catalog can answer honestly about it. Its only coverage
  # cell cites a non-redistributable source, so it resolves to NO_RIGHTS
  # rather than NO_DATA -- a materially different, and more accurate, refusal.
  #
  # This metric is genuinely unavailable from any green-tier source: FPL does
  # not publish it, and the free public-domain results feeds are match-level
  # only. There is no honest way to serve it.
  - metric_id: progressive_passes
    label_en: Progressive passes
    label_es: Pases progresivos
    description: Passes that move the ball significantly toward the opponent's goal.
    description_es: Pases que hacen avanzar el balón de forma significativa hacia la portería rival.
    granularity: box_score
    unit: count
    decimals: 0
